@if (title() || action()) {
  <div class="card__header" [class.card__header--bordered]="bordered()">
    <ng-content select="card-title">
      @let cardTitle = title();
      @if (cardTitle) {
        <h2 class="card__heading" test-id="card-heading">{{ cardTitle }}</h2>
      }
    </ng-content>
    @let cardAction = action();
    @if (cardAction) {
      <button
        type="button"
        class="card__action"
        (click)="actionClick.emit(`card-${id()}`)"
        test-id="card-action"
      >
        {{ cardAction }}
      </button>
    }
  </div>
}
<ng-content select="card-content" />
