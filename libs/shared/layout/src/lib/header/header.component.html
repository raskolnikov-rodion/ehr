<header class="header">
  <h1 class="header__home-link">
    <a routerLink="/">EHR</a>
  </h1>
  <ehr-theme-toggle />
  @if (isLoggedIn()) {
    <button
      class="header__logout-button"
      type="button"
      (click)="logout()"
      [attr.test-id]="'logout-button'"
    >
      Sign out
    </button>
  }
</header>
