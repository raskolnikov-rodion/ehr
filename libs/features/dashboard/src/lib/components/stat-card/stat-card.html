@let stat = statistic();
<ehr-card>
  <div ngProjectAs="card-content" class="stat-card">
    <div class="stat-card__header">
      <span class="stat-card__label">{{ stat.label }}</span>
      <span
        class="stat-card__icon"
        aria-hidden="true"
        [style.mask-image]="'url(' + stat.iconUrl + ')'"
      ></span>
    </div>
    <div class="stat-card__value">{{ stat.value }}</div>
    <div [class]="trendCssClass()">{{ stat.trend }}</div>
  </div>
</ehr-card>
