@let ptt = patient();
<span
  class="patient-item__avatar patient-item__avatar--{{ ptt.avatarColor }}"
  aria-hidden="true"
  >{{ ptt.initials }}</span
>
<div class="patient-item__body">
  <span class="patient-item__name">{{ ptt.name }}</span>
  <span class="patient-item__detail">{{ ptt.detail }}</span>
</div>
<span class="patient-item__visit">{{ ptt.lastVisit }}</span>
