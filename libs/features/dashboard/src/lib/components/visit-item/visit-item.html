@let v = visit();
<span
  class="visit-item__avatar visit-item__avatar--{{ v.avatarColor }}"
  aria-hidden="true"
  >{{ v.initials }}</span
>
<div class="visit-item__body">
  <span class="visit-item__name">{{ v.name }}</span>
  <span class="visit-item__detail">{{ v.detail }}</span>
</div>
<span class="visit-item__date">{{ v.lastVisit }}</span>
