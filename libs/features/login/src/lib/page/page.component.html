<div class="page">
  <ehr-brand-panel />

  <main class="form-panel">
    <div class="form-panel__inner">
      <ehr-form-header />

      @if (loginError(); as error) {
        <ehr-alert [message]="error" [id]="'login-error'" />
      }

      <ehr-login-form
        [isLoading]="isLoggingIn()"
        (formSubmit)="onFormSubmit($event)"
      />

      <div class="divider" aria-hidden="true">or</div>

      <button class="form-panel__btn-sso btn-tertiary" type="button">
        <span class="form-panel__btn-sso-icon" aria-hidden="true"></span>
        Continue with Single Sign-On
      </button>
    </div>
  </main>
</div>
