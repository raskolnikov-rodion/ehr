<form class="form" (submit)="onSubmit($event)">
  <div class="form__field">
    <label class="form__label" for="email">Email</label>
    @let email = form.email();
    @let emailInvalid = email.touched() && email.invalid();
    <input
      class="form__input"
      [class.form__input--invalid]="emailInvalid"
      id="email"
      type="email"
      [formField]="form.email"
      autocomplete="email"
      [attr.test-id]="'email-input'"
      [attr.aria-invalid]="emailInvalid || null"
      aria-describedby="email-error"
    />
    @if (emailInvalid) {
      <span
        class="form__error body-text-sm"
        id="email-error"
        role="alert"
        [attr.test-id]="'email-error'"
      >
        {{ email.errors()[0].message }}
      </span>
    }
  </div>

  <div class="form__field">
    <label class="form__label" for="password">Password</label>
    @let password = form.password();
    @let passwordInvalid = password.touched() && password.invalid();
    <input
      class="form__input"
      [class.form__input--invalid]="passwordInvalid"
      id="password"
      type="password"
      [formField]="form.password"
      autocomplete="current-password"
      [attr.test-id]="'password-input'"
      [attr.aria-invalid]="passwordInvalid || null"
      aria-describedby="password-error"
    />
    @if (passwordInvalid) {
      <span
        class="form__error body-text-sm"
        id="password-error"
        role="alert"
        [attr.test-id]="'password-error'"
      >
        {{ password.errors()[0].message }}
      </span>
    }
  </div>

  <button
    class="form__submit"
    type="submit"
    [disabled]="form().invalid()"
    [attr.test-id]="'submit-button'"
  >
    Sign in
  </button>
</form>
