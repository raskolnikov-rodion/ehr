<ehr-modal id="forgot-password-modal" (closed)="onModalClosed()">
  <div class="forgot-password-modal__content">
    <p class="forgot-password-modal__text">This is a demo app.</p>
    <p class="forgot-password-modal__text">
      Click the button below to fill in sample doctor credentials.
    </p>
    <button
      class="btn-primary forgot-password-modal__btn"
      type="button"
      test-id="demo-credentials-button"
      (click)="accept()"
    >
      Let's go!
    </button>
  </div>
</ehr-modal>
