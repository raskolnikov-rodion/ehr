<form class="form" (submit)="onSubmit($event)" novalidate>
  <div class="form__fields">
    <ehr-form-input
      id="email"
      label="Email address"
      type="email"
      [field]="form.email"
      autocomplete="email"
      placeholder="you@hospital.org"
      testId="email-input"
    />
    <ehr-form-input
      id="password"
      label="Password"
      type="password"
      [field]="form.password"
      autocomplete="current-password"
      placeholder="••••••••"
      testId="password-input"
    >
      <button
        class="form__forgot-btn"
        type="button"
        ngProjectAs="label-sibling"
        test-id="forgot-password-button"
        (click)="openForgotPasswordModal()"
      >
        Forgot password?
      </button>
    </ehr-form-input>
  </div>

  <div class="form__extras">
    <label class="form__extras-label">
      <!-- TODO: Add meaningful behaviour for this checkbox -->
      <input type="checkbox" autocomplete="off" />
      Remember me for 30 days
    </label>
  </div>

  <button
    class="form__submit btn-primary"
    type="submit"
    [disabled]="submitDisabled()"
    test-id="submit-button"
  >
    @if (isLoading()) {
      <span
        class="form__spinner"
        role="status"
        aria-label="Authenticating credentials, please wait..."
        test-id="login-loading"
      ></span>
    }
    <span class="form__btn-text" [class.form__btn-text--hidden]="isLoading()"
      >Sign in</span
    >
  </button>
</form>

<ehr-forgot-password-modal
  #forgotPasswordModal
  (credentialsAccepted)="onCredentialsAccepted()"
/>
